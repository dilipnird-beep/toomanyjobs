<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard | TooManyJobs.com</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="CSS/style.css" />
  <style>
    /* Specific Admin Overrides */
    .admin-wrapper { max-width: 1200px; margin: 2rem auto; padding: 0 1.5rem; }
    .admin-tabs { display: flex; gap: 1rem; border-bottom: 2px solid #e1e6ef; margin-bottom: 2rem; }
    .admin-tab-btn { background: none; border: none; font-size: 1.05rem; font-weight: 700; padding: 0.75rem 1rem; cursor: pointer; color: #64748b; border-bottom: 3px solid transparent; margin-bottom: -2px; }
    .admin-tab-btn.active { color: #1e3a8a; border-bottom-color: #1e3a8a; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .table-container { background: #fff; border-radius: 12px; border: 1px solid #e2e8f0; overflow-x: auto; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
    .data-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; text-align: left; }
    .data-table th { background: #f8fafc; padding: 0.85rem 1rem; font-weight: 700; border-bottom: 1px solid #e2e8f0; }
    .data-table td { padding: 0.85rem 1rem; border-bottom: 1px solid #f1f5f9; vertical-align: top; }
    .data-table tr:hover { background: #fcfdfe; }
    .action-btn-del { color: #ef4444; background: #fee2e2; border: none; padding: 0.35rem 0.65rem; border-radius: 6px; cursor: pointer; font-weight: 600; }
  </style>
</head>
<body style="background:#f8fafc;">

  <!-- Admin Nav -->
  <header class="navbar" style="background:#0f172a;">
    <div class="nav-container">
      <a href="admin.html" class="brand" style="color:#fff;">
        <span class="brand-badge" style="background:#3b82f6;">TMJ</span>
        <span class="brand-text" style="color:#fff;">Admin <span>Workspace</span></span>
      </a>
      <div class="nav-links">
        <a href="index.html" target="_blank" style="color:#94a3b8;">View Candidate Portal ↗</a>
        <button onclick="handleAdminLogout()" style="background:#dc2626; color:#fff; border:none; padding:0.4rem 0.8rem; border-radius:6px; cursor:pointer; font-weight:600;">Sign Out</button>
      </div>
    </div>
  </header>

  <div class="admin-wrapper">

    <!-- Login Wall -->
    <div id="admin-login-box" class="modal-box" style="margin: 3rem auto; max-width: 440px; box-shadow: 0 10px 25px rgba(0,0,0,0.1);">
      <h2 style="font-size:1.4rem; margin-bottom:0.5rem; text-align:center;">Recruiter / Admin Gate</h2>
      <p style="text-align:center; color:#64748b; font-size:0.9rem; margin-bottom:1.5rem;">Manage jobs on <strong>toomanyjobs.com</strong></p>
      
      <form onsubmit="handleAdminLogin(event)">
        <div class="form-group">
          <label>Admin ID / Email</label>
          <input type="text" id="admin-user-input" required placeholder="admin@toomanyjobs.com" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="admin-pass-input" required placeholder="Enter password (default: admin123)" />
        </div>
        <button type="submit" class="btn-search" style="width:100%; margin-top:0.5rem;">Access Dashboard</button>
      </form>
    </div>

    <!-- Protected Workspace -->
    <div id="admin-main-panel" style="display:none;">
      
      <div class="admin-tabs">
        <button class="admin-tab-btn active" onclick="switchAdminTab('tab-post', this)">➕ Post a New Opening</button>
        <button class="admin-tab-btn" onclick="switchAdminTab('tab-manage-jobs', this)">📋 Manage Active Jobs (<span id="total-jobs-count">0</span>)</button>
        <button class="admin-tab-btn" onclick="switchAdminTab('tab-applications', this)">📬 Applications Received (<span id="total-apps-count">0</span>)</button>
      </div>

      <!-- Tab 1: Post Job -->
      <div class="tab-content active" id="tab-post">
        <div class="modal-box" style="max-width:100%;">
          <h3>Create New Job Opportunity</h3>
          <form onsubmit="handleCreateJob(event)" style="margin-top:1.5rem;">
            <div class="form-row">
              <div class="form-group">
                <label>Job Title *</label>
                <input type="text" id="post-title" required placeholder="e.g. Senior Cloud & Performance Engineer" />
              </div>
              <div class="form-group">
                <label>Hiring Company *</label>
                <input type="text" id="post-company" required placeholder="e.g. Cognizant / TechCorp" />
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label>Job Location *</label>
                <input type="text" id="post-location" required placeholder="e.g. Hyderabad / Bengaluru / Remote" />
              </div>
              <div class="form-group">
                <label>Experience Range</label>
                <select id="post-experience">
                  <option value="Fresher">Fresher (0 - 1 Yrs)</option>
                  <option value="1-3 Years">1 - 3 Years</option>
                  <option value="3-7 Years" selected>3 - 7 Years</option>
                  <option value="8+ Years">8+ Years</option>
                </select>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label>Annual Salary / CTC Package</label>
                <input type="text" id="post-salary" placeholder="e.g. ₹18 - 25 LPA or Not Disclosed" />
              </div>
              <div class="form-group">
                <label>Sector / Category</label>
                <select id="post-category">
                  <option value="Software / IT">Software / IT</option>
                  <option value="AI / Data Science">AI / Data Science</option>
                  <option value="Cloud / DevOps">Cloud / DevOps</option>
                  <option value="Operations / SRE">Operations / SRE</option>
                  <option value="Remote">Remote</option>
                </select>
              </div>
            </div>

            <div class="form-group">
              <label>Mandatory Skills (Comma separated tags) *</label>
              <input type="text" id="post-skills" required placeholder="Python, AWS, LangGraph, Prometheus, Docker" />
            </div>

            <div class="form-group">
              <label>Full Job Description *</label>
              <textarea id="post-desc" rows="5" required placeholder="Specify key roles, day-to-day responsibilities, shift details, and minimum qualifications..."></textarea>
            </div>

            <button type="submit" class="btn-search" style="padding:0.75rem 2rem;">🚀 Publish Job Live</button>
          </form>
        </div>
      </div>

      <!-- Tab 2: Manage Jobs -->
      <div class="tab-content" id="tab-manage-jobs">
        <div class="table-container">
          <table class="data-table">
            <thead>
              <tr>
                <th>Job Title & Company</th>
                <th>Location</th>
                <th>Experience</th>
                <th>Salary</th>
                <th>Date Posted</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="admin-jobs-table-body">
              <!-- Injected by JS -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- Tab 3: Applications Received -->
      <div class="tab-content" id="tab-applications">
        <div class="table-container">
          <table class="data-table">
            <thead>
              <tr>
                <th>Candidate</th>
                <th>Applied Job</th>
                <th>Exp & CTC</th>
                <th>Resume link</th>
                <th>Date</th>
                <th>Cover Note</th>
              </tr>
            </thead>
            <tbody id="admin-apps-table-body">
              <!-- Injected by JS -->
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <script src="config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
